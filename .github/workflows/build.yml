name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Separate JARs for upload
        shell: bash
        run: |
          mkdir -p build/artifacts/main build/artifacts/sources
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) cp "$f" build/artifacts/sources/ ;;
              *)             cp "$f" build/artifacts/main/ ;;
            esac
          done

      - name: Upload main JAR
        uses: actions/upload-artifact@v7
        with:
          name: pulse
          path: build/artifacts/main/*.jar
          if-no-files-found: error

      - name: Upload sources JAR
        uses: actions/upload-artifact@v7
        with:
          name: pulse-sources
          path: build/artifacts/sources/*.jar
          if-no-files-found: ignore
